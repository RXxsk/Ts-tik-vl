<!DOCTYPE html>
<html lang="es">
<head>
  <style>
    body { background: #000; color: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; margin: 0; }
    .spinner { width: 50px; height: 50px; border: 4px solid #262626; border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <div style="font-weight: bold; letter-spacing: 2px;">INICIANDO SERVIDOR...</div>
</body>
</html>
